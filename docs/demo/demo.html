<style>

);border-bottom:1px solid rgba(97,175,239,.15)}.unified .diff-head{display:none}.unified .diff-row{display:block;min-width:760px}.unified .diff-cell{grid-template-columns:48px 48px 18px 1fr}.footer,.message{display:flex;align-items:center;padding:0 11px;border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message{color:var(--muted);font-size:12px;background:#0d1015}kbd{border:1px solid #4d596a;border-bottom-width:2px;border-radius:3px;padding:0 4px;font:inherit;font-size:11px;color:#cdd5e0}@media(max-width:920px){body{padding:0}.shell{width:100%;height:100vh;min-height:520px}.main{grid-template-columns:310px 1fr}.file-dir,.source-detail{display:none}}
</style>
</head>
<body>
<div class="shell" tabindex="0" id="app">

  <div class="main"><section class="pane left" id="left"></section><section class="pane right" id="right"></section></div>
  <div class="footer" id="footer"></div><div class="message" id="message">Unified diff is the default. Click a source or commit, then select one of its changed files.</div>
</div>
<script>
const D={session:[{h:'@@ -24,8 +24,14 @@'},{o:24,ot:'export async function createSession(userId: string) {',n:24,nt:'export async function createSession(userId: string) {'},{o:25,ot:'  const token = await issueToken(userId);',n:25,nt:'  const token = await issueToken(userId);'},{o:26,ot:'',n:26,nt:''},{o:27,ot:'  return token;',ok:'del',n:27,nt:'  if (!token) {',nk:'add'},{ot:'',ok:'empty',n:28,nt:'    throw new SessionError("Token issuance failed");',nk:'add'},{ot:'',ok:'empty',n:29,nt:'  }',nk:'add'},{ot:'',ok:'empty',n:30,nt:'',nk:'add'},{ot:'',ok:'empty',n:31,nt:'  audit.log({ userId, event: "session.created" });',nk:'add'},{ot:'',ok:'empty',n:32,nt:'  return token;',nk:'add'},{o:28,ot:'}',n:33,nt:'}'},{h:'@@ -52,5 +58,7 @@'},{o:52,ot:'export function revokeSession(id: string) {',n:58,nt:'export function revokeSession(id: string) {'},{o:53,ot:'  sessionStore.delete(id);',ok:'del',n:59,nt:'  const revoked = sessionStore.delete(id);',nk:'add'},{ot:'',ok:'empty',n:60,nt:'  if (!revoked) return false;',nk:'add'},{o:54,ot:'  return true;',n:61,nt:'  return true;'},{o:55,ot:'}',n:62,nt:'}'}],login:[{h:'@@ -8,10 +8,12 @@'},{o:8,ot:'export async function login(email: string, password: string) {',n:8,nt:'export async function login(email: string, password: string) {'},{o:9,ot:'  const user = await users.findByEmail(email);',n:9,nt:'  const user = await users.findByEmail(email);'},{o:10,ot:'  if (!user) return null;',ok:'del',n:10,nt:'  if (!user) throw new InvalidCredentialsError();',nk:'add'},{o:11,ot:'',n:11,nt:''},{o:12,ot:'  const valid = await compare(password, user.password);',n:12,nt:'  const valid = await compare(password, user.password);'},{o:13,ot:'  if (!valid) return null;',ok:'del',n:13,nt:'  if (!valid) throw new InvalidCredentialsError();',nk:'add'},{o:14,ot:'',n:14,nt:''},{o:15,ot:'  return createSession(user.id);',ok:'del',n:15,nt:'  rateLimit.reset(email);',nk:'add'},{ot:'',ok:'empty',n:16,nt:'  return createSession(user.id);',nk:'add'},{o:16,ot:'}',n:17,nt:'}'}],tests:[{h:'@@ -0,0 +1,14 @@'},{ot:'',ok:'empty',n:1,nt:'import { describe, expect, it } from "vitest";',nk:'add'},{ot:'',ok:'empty',n:2,nt:'import { login } from "../src/auth/login";',nk:'add'},{ot:'',ok:'empty',n:3,nt:'',nk:'add'},{ot:'',ok:'empty',n:4,nt:'describe("login", () => {',nk:'add'},{ot:'',ok:'empty',n:5,nt:'  it("rejects unknown users", async () => {',nk:'add'},{ot:'',ok:'empty',n:6,nt:'    await expect(login("missing@example.com", "x"))',nk:'add'},{ot:'',ok:'empty',n:7,nt:'      .rejects.toThrow("Invalid credentials");',nk:'add'},{ot:'',ok:'empty',n:8,nt:'  });',nk:'add'},{ot:'',ok:'empty',n:9,nt:'});',nk:'add'}],package:[{h:'@@ -7,7 +7,8 @@'},{o:7,ot:'    "test": "vitest"',ok:'del',n:7,nt:'    "test": "vitest run",',nk:'add'},{ot:'',ok:'empty',n:8,nt:'    "test:watch": "vitest"',nk:'add'},{o:8,ot:'  },',n:9,nt:'  },'}],service:[{h:'@@ -0,0 +1,8 @@'},{ot:'',ok:'empty',n:1,nt:'import { sessionStore } from "./store";',nk:'add'},{ot:'',ok:'empty',n:2,nt:'',nk:'add'},{ot:'',ok:'empty',n:3,nt:'export class SessionService {',nk:'add'},{ot:'',ok:'empty',n:4,nt:'  async create(userId: string) {',nk:'add'},{ot:'',ok:'empty',n:5,nt:'    const session = await sessionStore.create(userId);',nk:'add'},{ot:'',ok:'empty',n:6,nt:'    return session.token;',nk:'add'},{ot:'',ok:'empty',n:7,nt:'  }',nk:'add'},{ot:'',ok:'empty',n:8,nt:'}',nk:'add'}],server:[{h:'@@ -0,0 +1,7 @@'},{ot:'',ok:'empty',n:1,nt:'import Fastify from "fastify";',nk:'add'},{ot:'',ok:'empty',n:2,nt:'',nk:'add'},{ot:'',ok:'empty',n:3,nt:'const app = Fastify({ logger: true });',nk:'add'},{ot:'',ok:'empty',n:4,nt:'',nk:'add'},{ot:'',ok:'empty',n:5,nt:'app.get("/health", async () => ({ ok: true }));',nk:'add'},{ot:'',ok:'empty',n:6,nt:'',nk:'add'},{ot:'',ok:'empty',n:7,nt:'await app.listen({ port: 3000 });',nk:'add'}]};
const F=(path,status,plus,minus,diff)=>({path,status,plus,minus,diff});
const sources=[
 {kind:'working',icon:'W',label:'Working Tree',detail:'unstaged + untracked',files:[F('src/api/session.ts','M',8,2,'session'),F('src/auth/login.ts','M',5,3,'login'),F('tests/auth.test.ts','A',28,0,'tests')]},
 {kind:'staged',icon:'S',label:'Staged Changes',detail:'index vs HEAD',files:[F('package.json','M',2,1,'package')]},
 {kind:'commit',icon:'●',oid:'8f3c2a1',label:'Add token validation',detail:'Lucas · Aug 25 · HEAD',files:[F('src/api/session.ts','M',8,2,'session'),F('src/auth/login.ts','M',5,3,'login'),F('tests/auth.test.ts','A',28,0,'tests')]},
 {kind:'commit',icon:'●',oid:'2ab91c0',label:'Refactor session service',detail:'Lucas · Aug 24',files:[F('src/api/session-service.ts','A',34,0,'service'),F('src/api/session.ts','M',6,19,'session')]},
 {kind:'commit',icon:'●',oid:'f8ee441',label:'Add login regression tests',detail:'Maya · Aug 24',files:[F('tests/login-regression.test.ts','A',42,0,'tests')]},
 {kind:'commit',icon:'◆',oid:'a19bc0e',label:'Merge feature/auth into main',detail:'Lucas · Aug 23 · parent 1/2',files:[F('src/api/session.ts','M',8,2,'session'),F('src/auth/login.ts','M',5,3,'login')]},
 {kind:'commit',icon:'●',oid:'31ce90a',label:'Bootstrap API server',detail:'Lucas · Aug 22',files:[F('src/server.ts','A',31,0,'server'),F('package.json','M',4,1,'package')]}
];
const state={source:0,file:0,focus:'sources',view:'unified',reviewed:new Set()};
const app=document.getElementById('app'),left=document.getElementById('left'),right=document.getElementById('right'),footer=document.getElementById('footer'),message=document.getElementById('message'),context=document.getElementById('context');
const src=()=>sources[state.source],file=()=>src().files[state.file];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const key=f=>`${src().kind}:${src().oid||src().label}:${f.path}`;
function sourceRow(s,i){const selected=i===state.source;return `<button class="source-row ${selected?'selected':''}" data-source="${i}"><span class="source-icon ${s.kind}">${s.icon}</span><span class="source-main"><span class="source-label">${s.kind==='commit'?`<span style="color:var(--purple)">${s.oid}</span> `:''}${esc(s.label)}</span><span class="source-detail">${esc(s.detail)}</span></span><span class="source-count">${s.files.length}</span></button>`}
function fileRow(f,i){const selected=i===state.file,reviewed=state.reviewed.has(key(f));const name=f.path.split('/').pop(),dir=f.path.includes('/')?f.path.slice(0,f.path.lastIndexOf('/')):'';return `<button class="file-row ${selected?'selected':''}" data-file="${i}"><span class="reviewed">${reviewed?'✓':''}</span><span class="status ${f.status}">${f.status}</span><span class="file-main"><span class="file-name">${esc(name)}</span><span class="file-dir">${esc(dir)}</span></span><span class="stats"><span class="plus">+${f.plus}</span> <span class="minus">-${f.minus}</span></span></button>`}
function renderLeft(){const workspace=sources.slice(0,2).map((s,i)=>sourceRow(s,i)).join(''),commits=sources.slice(2).map((s,i)=>sourceRow(s,i+2)).join(''),files=src().files.map(fileRow).join('');const meta=src().kind==='commit'?`<div class="source-meta">${src().oid} · compared with ${src().icon==='◆'?'parent 1':'its parent'} · read-only</div>`:'';left.innerHTML=`<div class="pane-title">SOURCE CONTROL</div><div class="section">WORKSPACE</div>${workspace}<div class="section">RECENT COMMITS</div>${commits}<div class="section">FILES CHANGED (${src().files.length})</div>${meta}${files}`}
function cell(no,text,kind){const marker=kind==='add'?'+':kind==='del'?'-':' ';return `<div class="diff-cell ${kind||''}"><span class="ln">${no??''}</span><span class="mark">${marker}</span><span class="code">${esc(text??'')}</span></div>`}
function renderDiff(){const f=file(),rows=D[f.diff]||[];right.classList.toggle('unified',state.view==='unified');let content;if(state.view==='side'){content=`<div class="diff-head"><div>ORIGINAL</div><div>MODIFIED</div></div>`+rows.map(r=>r.h?`<div class="diff-row"><div class="hunk">${esc(r.h)}</div></div>`:`<div class="diff-row">${cell(r.o,r.ot,r.ok)}${cell(r.n,r.nt,r.nk)}</div>`).join('')}else{const out=[];rows.forEach(r=>{if(r.h){out.push(`<div class="diff-row"><div class="hunk">${esc(r.h)}</div></div>`);return}if(r.ok==='del')out.push(`<div class="diff-row"><div class="diff-cell del"><span class="ln">${r.o??''}</span><span class="ln"></span><span class="mark">-</span><span class="code">${esc(r.ot??'')}</span></div></div>`);if(r.nk==='add')out.push(`<div class="diff-row"><div class="diff-cell add"><span class="ln"></span><span class="ln">${r.n??''}</span><span class="mark">+</span><span class="code">${esc(r.nt??'')}</span></div></div>`);if(!r.ok&&!r.nk)out.push(`<div class="diff-row"><div class="diff-cell"><span class="ln">${r.o??''}</span><span class="ln">${r.n??''}</span><span class="mark"> </span><span class="code">${esc(r.nt??'')}</span></div></div>`)});content=out.join('')}const scope=src().kind==='commit'?`${src().oid} · `:'';right.innerHTML=`<div class="pane-title">${scope}${esc(f.path)} · ${state.view==='side'?'SIDE-BY-SIDE':'UNIFIED -/+'}</div><div class="diff-scroll">${content}</div>`}
function renderFooter(){const reviewed=src().files.filter(f=>state.reviewed.has(key(f))).length;footer.innerHTML=`${reviewed}/${src().files.length} reviewed &nbsp; <kbd>Tab</kbd>&nbsp; source/files/diff &nbsp; <kbd>↑↓</kbd>&nbsp; select &nbsp; <kbd>v</kbd>&nbsp; side-by-side &nbsp; <kbd>Space</kbd>&nbsp; reviewed &nbsp; <kbd>q</kbd>&nbsp; close`}
function render(){context.textContent=src().kind==='commit'?`${src().oid} · ${src().label}`:src().label;renderLeft();renderDiff();renderFooter();app.focus()}
function selectSource(i){state.source=i;state.file=0;state.focus='sources';message.textContent=`Selected ${src().kind==='commit'?`commit ${src().oid}`:src().label}; loaded ${src().files.length} changed file${src().files.length===1?'':'s'}.`;render()}
function selectFile(i){state.file=i;state.focus='files';message.textContent=`Selected ${file().path}; diff updated immediately.`;render()}
left.addEventListener('click',e=>{const s=e.target.closest('[data-source]'),f=e.target.closest('[data-file]');if(s)selectSource(Number(s.dataset.source));else if(f)selectFile(Number(f.dataset.file))});
document.addEventListener('keydown',e=>{const k=e.key;if(k==='q'){message.textContent='In Pi, q would close the reviewer and return to the same agent session.';return}if(k==='Tab'){e.preventDefault();state.focus=state.focus==='sources'?'files':state.focus==='files'?'diff':'sources'}else if(k==='ArrowDown'||k==='j'){if(state.focus==='sources')selectSource(Math.min(sources.length-1,state.source+1));else if(state.focus==='files')selectFile(Math.min(src().files.length-1,state.file+1));else return}else if(k==='ArrowUp'||k==='k'){if(state.focus==='sources')selectSource(Math.max(0,state.source-1));else if(state.focus==='files')selectFile(Math.max(0,state.file-1));else return}else if(k==='Enter'){state.focus=state.focus==='sources'?'files':state.focus==='files'?'diff':'diff'}else if(k==='v'){state.view=state.view==='side'?'unified':'side';message.textContent=state.view==='side'?'Optional side-by-side view enabled. A new /diff session would still open unified.':'Unified diff restored — this is the default view.'}else if(k===' '){e.preventDefault();const f=file(),id=key(f);state.reviewed.has(id)?state.reviewed.delete(id):state.reviewed.add(id)}else return;e.preventDefault();render()});
render();
</script>
